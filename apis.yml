aid: terra-co2
name: Terra CO2
description: >-
  Terra CO2 Technology is a Golden, Colorado climate-technology and building-materials
  manufacturer that produces low-carbon replacements for Portland cement. Its commercial
  product, OPUS SCM, is a supplementary cementitious material that replaces up to 50% of
  the Portland cement in a concrete mix as a drop-in substitute for legacy SCMs such as
  fly ash, cutting CO2 by roughly 70% and NOx by roughly 90% per ton replaced, and it is
  produced from abundant silicate feedstocks rather than coal-plant by-products. A second
  product, OPUS ZERO, targets a full zero-carbon cement replacement and is in concrete
  trials. The company runs a pilot and materials R&D facility in Golden and is building a
  240,000-ton-per-year commercial plant in Cleburne, Texas, backed by more than $250M
  raised from climate and construction investors including Cemex Ventures. Terra CO2
  sells physical material into the construction supply chain; it publishes no developer
  program, no public API, and no machine-readable API contract.
